<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ATNI GeoBase 3D terrain and wind resource display</title>
<link rel="stylesheet" href="cesium/Widgets/widgets.css">
<style>
@font-face { font-family: "League Spartan"; src: url("../fonts/league-spartan-var.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("../fonts/poppins-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
:root { --ground: #010b13; --text: #e8ecf0; --muted: #b9c1c8; --red: #e13d33; --red-on-dark: #f26b5e; --panel: rgb(1 11 19 / 0.86); --line: rgb(232 236 240 / 0.28); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); font: 500 0.8125rem/1.35 Poppins, system-ui, sans-serif; overflow: hidden; }
#globe { position: absolute; inset: 0; }
.cesium-viewer-bottom, .cesium-widget-credits { display: none !important; }
.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.6s; }
.ready .still { opacity: 0; pointer-events: none; }
.bar { position: absolute; left: 0.5rem; right: 0.5rem; top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; pointer-events: none; }
.bar > * { pointer-events: auto; }
.grp { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); }
button { font: 600 0.75rem/1 "League Spartan", system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 0; min-height: 2.25rem; min-width: 2.75rem; padding: 0.55rem 0.7rem 0.45rem; cursor: pointer; }
button:hover { background: rgb(22 32 42 / 0.94); }
button[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--red); }
button:focus-visible { outline: 2px solid var(--red-on-dark); outline-offset: 2px; position: relative; z-index: 1; }
.legend { position: absolute; left: 0.5rem; bottom: 0.5rem; background: var(--panel); border: 1px solid var(--line); padding: 0.45rem 0.6rem 0.5rem; max-width: calc(100% - 1rem); }
.legend p { margin: 0 0 0.3rem; font-family: "League Spartan", system-ui, sans-serif; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.6875rem; }
.ramp { width: 11rem; max-width: 100%; height: 0.5rem; background: linear-gradient(90deg, rgb(245 196 81 / 0.25), rgb(240 138 60 / 0.7), rgb(225 61 51)); }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.6875rem; margin-top: 0.2rem; }
.legend[hidden] { display: none; }
.hint { position: absolute; right: 0.5rem; bottom: 0.5rem; max-width: 18rem; background: var(--panel); border: 1px solid var(--line); padding: 0.4rem 0.6rem; color: var(--muted); font-size: 0.6875rem; }
.status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); padding: 0.6rem 0.9rem; max-width: 80%; text-align: center; }
.status:empty { display: none; }
.bare .bar, .bare .legend, .bare .hint, .bare .status { display: none; }
@media (max-width: 30em) {
  .hint { display: none; }
  .bar { left: 0.25rem; right: 0.25rem; top: 0.25rem; gap: 0.25rem; }
  button { font-size: 0.6875rem; min-height: 2rem; padding: 0.45rem 0.45rem 0.35rem; letter-spacing: 0.05em; }
  .legend { left: 0.25rem; bottom: 0.25rem; padding: 0.3rem 0.45rem 0.35rem; }
  .ramp { width: 6.5rem; }
}
</style>
</head>
<body>
<img class="still" src="still.jpg" alt="Three-dimensional terrain under aerial imagery with a gold-to-red wind resource layer showing modeled wind speed across ridges and valleys">
<div id="globe" aria-hidden="true"></div>
<div class="bar">
  <div class="grp" role="group" aria-label="Camera">
    <button type="button" data-view="overview">Overview</button>
    <button type="button" data-view="west">West</button>
    <button type="button" data-view="center">Center</button>
    <button type="button" data-view="east">East</button>
    <button type="button" data-view="top">Top</button>
  </div>
  <div class="grp">
    <button type="button" id="wind" aria-pressed="true">Wind layer</button>
    <button type="button" id="relief" aria-pressed="false">2x relief</button>
  </div>
</div>
<div class="legend" id="legend"><p>Wind Speed</p><div class="ramp"></div><div class="ends"><span>4 m/s</span><span>15 m/s</span></div></div>
<p class="hint">Drag to orbit, scroll or pinch to zoom; keyboard: use the view buttons.</p>
<p class="status" id="status" role="status">Loading 3D view...</p>
<script>window.CESIUM_BASE_URL = "cesium/";</script>
<script src="cesium/Cesium.js"></script>
<script>
(async function () {
  "use strict";
  var status = document.getElementById("status");
  var FAIL = "This display requires WebGL. The still image stands in.";
  if (!window.Cesium) { status.textContent = FAIL; return; }
  var C = window.Cesium;  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var BOUNDS = C.Rectangle.fromDegrees(-122.50444547763546, 45.473645866057595, -120.47745472415154, 46.02625628738846);

  // Terrain tiles are stored gzipped (Pages cannot send Content-Encoding for .terrain): gunzip here.
  var fetchAB = C.Resource.prototype.fetchArrayBuffer;
  C.Resource.prototype.fetchArrayBuffer = function () {
    var p = fetchAB.apply(this, arguments);
    if (!p || !/\.terrain(\?|$)/.test(this.url)) return p;
    return p.then(function (buf) {
      if (!buf || buf.byteLength < 2) return buf;
      var b = new Uint8Array(buf, 0, 2);
      if (b[0] !== 0x1f || b[1] !== 0x8b) return buf;
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    });
  };

  var viewer;
  try {
    viewer = new C.Viewer("globe", {
      baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false, infoBox: false,
      selectionIndicator: false, vrButton: false, requestRenderMode: true, maximumRenderTimeChange: Infinity,
      skyBox: false, contextOptions: { webgl: { preserveDrawingBuffer: true } }
    });
  } catch (e) { status.textContent = FAIL; return; }
  var scene = viewer.scene, globe = scene.globe;
  scene.backgroundColor = C.Color.fromCssColorString("#010b13");
  globe.baseColor = C.Color.fromCssColorString("#0b1620");
  globe.showGroundAtmosphere = false;
  if (scene.sun) scene.sun.show = false;
  if (scene.moon) scene.moon.show = false;
  scene.skyAtmosphere.show = false; // no saturated blue (D28): the slab floats on the ATNI ground
  globe.enableLighting = false;
  globe.backFaceCulling = false; // the source mesh tiles are wound clockwise
  globe.cartographicLimitRectangle = BOUNDS; // draw only where every layer has data
  globe.maximumScreenSpaceError = 1.5;
  var ctl = scene.screenSpaceCameraController;
  ctl.minimumZoomDistance = 600; ctl.maximumZoomDistance = 160000;

  try {
    viewer.terrainProvider = await C.CesiumTerrainProvider.fromUrl("terrain/");
  } catch (e) { /* the imagery still drapes the ellipsoid */ }
  var img = new C.UrlTemplateImageryProvider({
    url: "imagery/{z}/{x}/{y}.jpg", tilingScheme: new C.WebMercatorTilingScheme(),
    rectangle: BOUNDS, minimumLevel: 8, maximumLevel: 13
  });
  viewer.imageryLayers.addImageryProvider(img);
  var wind = viewer.imageryLayers.addImageryProvider(new C.UrlTemplateImageryProvider({
    url: "wind/{z}/{x}/{y}.png", tilingScheme: new C.WebMercatorTilingScheme(),
    rectangle: BOUNDS, minimumLevel: 8, maximumLevel: 13
  }));
  wind.alpha = 0.5;

  var VIEWS = {
    overview: [-121.95, 45.05, 30000, 28, -24],
    west: [-122.30, 45.50, 9000, 70, -16],
    center: [-121.62, 45.52, 9000, 15, -20],
    east: [-120.95, 45.50, 11000, -20, -20],
    top: [-121.49, 45.75, 95000, 0, -90]
  };
  function go(name, instant) {
    var v = VIEWS[name];
    var o = { destination: C.Cartesian3.fromDegrees(v[0], v[1], v[2]),
              orientation: { heading: C.Math.toRadians(v[3]), pitch: C.Math.toRadians(v[4]), roll: 0 } };
    if (instant || reduce) viewer.camera.setView(o); else viewer.camera.flyTo(Object.assign(o, { duration: 2 }));
    document.querySelectorAll("[data-view]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.view === name)); });
    scene.requestRender();
  }
  document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { go(b.dataset.view); }); });
  var windBtn = document.getElementById("wind"), legend = document.getElementById("legend");
  windBtn.addEventListener("click", function () {
    var on = windBtn.getAttribute("aria-pressed") !== "true";
    windBtn.setAttribute("aria-pressed", String(on)); wind.show = on; legend.hidden = !on; scene.requestRender();
  });
  var reliefBtn = document.getElementById("relief");
  reliefBtn.addEventListener("click", function () {
    var on = reliefBtn.getAttribute("aria-pressed") !== "true";
    reliefBtn.setAttribute("aria-pressed", String(on)); scene.verticalExaggeration = on ? 2 : 1; scene.requestRender();
  });
  var qs = new URLSearchParams(location.search);
  if (qs.has("bare")) document.body.classList.add("bare");
  // Opens on the still's own view, so the still hands over to the live scene without a jump.
  go(VIEWS[qs.get("view")] ? qs.get("view") : "center", true);

  // Reveal once the first view's tiles have loaded.
  var shown = false;
  globe.tileLoadProgressEvent.addEventListener(function (n) {
    if (!shown && n === 0 && globe.tilesLoaded) { shown = true; document.body.classList.add("ready"); status.textContent = ""; }
  });
  setTimeout(function () { if (!shown) { shown = true; document.body.classList.add("ready"); status.textContent = ""; } }, 12000);
})();
</script>
</body>
</html>
