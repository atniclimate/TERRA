<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ATNI GeoBase 3D terrain and wind resource display</title>
<link rel="stylesheet" href="cesium/Widgets/widgets.css">
<style>
@font-face { font-family: "League Spartan"; src: url("../fonts/league-spartan-var.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
@font-face { font-family: "Poppins"; src: url("../fonts/poppins-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
:root { --ground: #010b13; --text: #e8ecf0; --muted: #b9c1c8; --red: #e13d33; --red-on-dark: #f26b5e; --panel: rgb(1 11 19 / 0.86); --line: rgb(232 236 240 / 0.28); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ground); color: var(--text); font: 500 0.8125rem/1.35 Poppins, system-ui, sans-serif; overflow: hidden; }
#globe { position: absolute; inset: 0; }
.cesium-viewer-bottom, .cesium-widget-credits { display: none !important; }
.still { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.6s; }
.ready .still { opacity: 0; pointer-events: none; }
.failed .still { opacity: 1; transition: none; }
.failed #globe, .failed .hint { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .still { transition: none; } }
.bar { position: absolute; left: 0.5rem; right: 0.5rem; top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; pointer-events: none; }
.bar > * { pointer-events: auto; }
.grp { display: flex; flex-wrap: wrap; gap: 1px; background: var(--line); border: 1px solid var(--line); }
button { font: 600 0.75rem/1 "League Spartan", system-ui, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text); background: var(--panel); border: 0; min-height: 2.25rem; min-width: 2.75rem; padding: 0.55rem 0.7rem 0.45rem; cursor: pointer; }
button:hover { background: rgb(22 32 42 / 0.94); }
button[aria-pressed="true"] { box-shadow: inset 0 -3px 0 var(--red); }
button:focus-visible { outline: 2px solid var(--red-on-dark); outline-offset: 2px; position: relative; z-index: 1; }
.legend { position: absolute; left: 0.5rem; bottom: 0.5rem; background: var(--panel); border: 1px solid var(--line); padding: 0.45rem 0.6rem 0.5rem; max-width: calc(100% - 1rem); }
.legend p { margin: 0 0 0.3rem; font-family: "League Spartan", system-ui, sans-serif; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.6875rem; }
.ramp { width: 11rem; max-width: 100%; height: 0.5rem; background: linear-gradient(90deg, rgb(245 196 81 / 0.25), rgb(240 138 60 / 0.7), rgb(225 61 51)); }
.ends { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.6875rem; margin-top: 0.2rem; }
.legend[hidden] { display: none; }
.hint { position: absolute; right: 0.5rem; bottom: 0.5rem; max-width: 18rem; background: var(--panel); border: 1px solid var(--line); padding: 0.4rem 0.6rem; color: var(--muted); font-size: 0.6875rem; }
.status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--line); padding: 0.6rem 0.9rem; max-width: 80%; text-align: center; }
.status:empty { display: none; }
.cam button { font-size: 0.9375rem; padding-inline: 0.5rem; min-width: 2.5rem; }
.orbit { position: absolute; right: 0.25rem; bottom: 0.25rem; border: 1px solid var(--line); }
.orbit[hidden] { display: none; }
/* Phones: a simple orbiting view; touches pass through to the page so it never traps scrolling. */
.phone .bar, .phone .hint { display: none; }
.phone #globe { pointer-events: none; }
.bare .bar, .bare .legend, .bare .hint, .bare .status, .bare .orbit { display: none; }
@media (max-width: 30em) {
  .hint { display: none; }
  .bar { left: 0.25rem; right: 0.25rem; top: 0.25rem; gap: 0.25rem; }
  button { font-size: 0.6875rem; min-height: 2rem; padding: 0.45rem 0.45rem 0.35rem; letter-spacing: 0.05em; }
  .legend { left: 0.25rem; bottom: 0.25rem; padding: 0.3rem 0.45rem 0.35rem; }
  .ramp { width: 6.5rem; }
}
</style>
</head>
<body>
<img class="still" src="still.jpg" alt="Three-dimensional terrain under aerial imagery with a gold-to-red wind resource layer showing modeled wind speed across ridges and valleys">
<div id="globe" aria-hidden="true"></div>
<div class="bar">
  <div class="grp">
    <button type="button" id="mode3d" aria-pressed="false">3D view</button>
    <button type="button" id="reset">Reset</button>
  </div>
  <div class="grp cam" role="group" aria-label="Camera">
    <button type="button" data-cam="left" aria-label="Rotate left" title="Rotate left"><span aria-hidden="true">&#8634;</span></button>
    <button type="button" data-cam="right" aria-label="Rotate right" title="Rotate right"><span aria-hidden="true">&#8635;</span></button>
    <button type="button" data-cam="up" aria-label="Tilt up" title="Tilt up"><span aria-hidden="true">&#9650;</span></button>
    <button type="button" data-cam="down" aria-label="Tilt down" title="Tilt down"><span aria-hidden="true">&#9660;</span></button>
    <button type="button" data-cam="in" aria-label="Zoom in" title="Zoom in"><span aria-hidden="true">+</span></button>
    <button type="button" data-cam="out" aria-label="Zoom out" title="Zoom out"><span aria-hidden="true">&#8722;</span></button>
  </div>
  <div class="grp" role="group" aria-label="Layers">
    <button type="button" data-layer="imagery" aria-pressed="true">Imagery</button>
    <button type="button" data-layer="wind" aria-pressed="true">Wind</button>
    <button type="button" data-layer="terrain" aria-pressed="true">Terrain</button>
  </div>
</div>
<button type="button" id="orbit" class="orbit" hidden>Pause</button>
<div class="legend" id="legend"><p>Wind Speed</p><div class="ramp"></div><div class="ends"><span>4 m/s</span><span>15 m/s</span></div></div>
<p class="hint">Drag to move, scroll or pinch to zoom; the camera buttons do the same from the keyboard.</p>
<p class="status" id="status" role="status">Loading 3D view...</p>
<script>window.CESIUM_BASE_URL = "cesium/";</script>
<script src="cesium/Cesium.js"></script>
<script>
(async function () {
  "use strict";
  var status = document.getElementById("status");
  var FAIL = "This display requires WebGL. The still image stands in.", LOAD_FAIL = "The 3D view could not load. The still image remains available.";
  var failed = false, shown = false;
  function controls(disabled) {
    document.querySelectorAll("button").forEach(function (b) { b.disabled = disabled; });
  }
  function failLoad(message) {
    if (failed) return;
    failed = true;
    document.body.classList.remove("ready"); document.body.classList.add("failed");
    status.textContent = typeof message === "string" ? message : LOAD_FAIL;
    controls(true);
    if (orbitBtn) { orbit(false); orbitBtn.hidden = true; }
    if (viewer) {
      if (camera) stopCamera(); else viewer.camera.cancelFlight();
      viewer.scene.screenSpaceCameraController.enableInputs = false;
      viewer.useDefaultRenderLoop = false;
    }
  }
  controls(true);
  if (!window.Cesium) { failLoad(); return; }
  var C = window.Cesium, motion = matchMedia("(prefers-reduced-motion: reduce)");
  var reduce = motion.matches;
  var BOUNDS = C.Rectangle.fromDegrees(-122.50444547763546, 45.473645866057595, -120.47745472415154, 46.02625628738846);

  // Terrain tiles are stored gzipped (Pages cannot send Content-Encoding for .terrain): gunzip here.
  var fetchAB = C.Resource.prototype.fetchArrayBuffer;
  C.Resource.prototype.fetchArrayBuffer = function () {
    var p = fetchAB.apply(this, arguments);
    if (!p || !/\.terrain(\?|$)/.test(this.url)) return p;
    return p.then(function (buf) {
      if (!buf || buf.byteLength < 2) return buf;
      var b = new Uint8Array(buf, 0, 2);
      if (b[0] !== 0x1f || b[1] !== 0x8b) return buf;
      return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    });
  };

  var viewer;
  try {
    viewer = new C.Viewer("globe", {
      baseLayer: false, baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
      navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false, infoBox: false,
      selectionIndicator: false, vrButton: false, requestRenderMode: true, maximumRenderTimeChange: Infinity,
      skyBox: false, showRenderLoopErrors: false, contextOptions: { webgl: { preserveDrawingBuffer: true } }
    });
  } catch (e) { failLoad(FAIL); return; }
  var scene = viewer.scene, globe = scene.globe;
  scene.renderError.addEventListener(failLoad);
  scene.canvas.addEventListener("webglcontextlost", function () { failLoad(FAIL); });
  scene.backgroundColor = C.Color.fromCssColorString("#010b13");
  globe.baseColor = C.Color.fromCssColorString("#0b1620");
  globe.showGroundAtmosphere = false;
  if (scene.sun) scene.sun.show = false;
  if (scene.moon) scene.moon.show = false;
  scene.skyAtmosphere.show = false; // no saturated blue (D28): the slab floats on the ATNI ground
  globe.enableLighting = false;
  globe.backFaceCulling = false; // the source mesh tiles are wound clockwise
  globe.cartographicLimitRectangle = BOUNDS; // draw only where every layer has data
  globe.maximumScreenSpaceError = 1.5;
  globe.preloadAncestors = false;
  var ctl = scene.screenSpaceCameraController;
  ctl.minimumZoomDistance = 600; ctl.maximumZoomDistance = 160000;

  try {
    var terrain = await C.CesiumTerrainProvider.fromUrl("terrain/");
    if (failed) return;
    terrain.errorEvent.addEventListener(failLoad);
    viewer.terrainProvider = terrain;
  } catch (e) { failLoad(); return; }
  var img = new C.UrlTemplateImageryProvider({
    url: "imagery/{z}/{x}/{y}.jpg", tilingScheme: new C.WebMercatorTilingScheme(),
    rectangle: BOUNDS, minimumLevel: 8, maximumLevel: 13
  });
  img.errorEvent.addEventListener(failLoad);
  viewer.imageryLayers.addImageryProvider(img);
  var windSource = new C.UrlTemplateImageryProvider({
    url: "wind/{z}/{x}/{y}.png", tilingScheme: new C.WebMercatorTilingScheme(),
    rectangle: BOUNDS, minimumLevel: 8, maximumLevel: 13
  });
  windSource.errorEvent.addEventListener(failLoad);
  var wind = viewer.imageryLayers.addImageryProvider(windSource);
  wind.alpha = 0.5;

  var camera = viewer.camera, D = C.Math.toRadians;
  var HOME = C.Cartesian3.fromDegrees(-121.49, 45.75, 0);
  var TOP = C.Rectangle.fromDegrees(-122.56, 45.40, -120.42, 46.10);
  var PITCH_3D = D(-32), PITCH_MIN = D(-89.9), PITCH_MAX = D(-8);
  var RANGE_MIN = 2500, RANGE_MAX = 150000;
  var mode3d = document.getElementById("mode3d");

  // The point under the middle of the view: what rotate, tilt and zoom turn around.
  function target() {
    var mid = new C.Cartesian2(scene.canvas.clientWidth / 2, scene.canvas.clientHeight / 2);
    var ray = camera.getPickRay(mid);
    return (ray && globe.pick(ray, scene)) || camera.pickEllipsoid(mid) || HOME;
  }
  function pose() {
    var t = target();
    return { t: t, h: camera.heading, p: camera.pitch, r: C.Cartesian3.distance(camera.position, t) };
  }
  var anim = 0;
  function stopCamera() { anim++; camera.cancelFlight(); }
  // Cancel before Cesium handles the same gesture; do not consume native camera input.
  scene.canvas.addEventListener("pointerdown", stopCamera, { capture: true, passive: true });
  scene.canvas.addEventListener("wheel", stopCamera, { capture: true, passive: true });
  function place(t, h, p, r, instant) {
    stopCamera();
    p = Math.min(PITCH_MAX, Math.max(PITCH_MIN, p)); r = Math.min(RANGE_MAX, Math.max(RANGE_MIN, r));
    var from = pose(), id = ++anim, t0 = performance.now(), dur = instant || reduce ? 0 : 450;
    var dh = ((h - from.h + 3 * Math.PI) % (2 * Math.PI)) - Math.PI;
    (function step(now) {
      if (id !== anim) return;
      var k = dur ? Math.min(1, (now - t0) / dur) : 1, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.lookAt(t, new C.HeadingPitchRange(from.h + dh * e, from.p + (p - from.p) * e, from.r + (r - from.r) * e));
      camera.lookAtTransform(C.Matrix4.IDENTITY);
      scene.requestRender();
      if (k < 1) requestAnimationFrame(step); else sync();
    })(t0);
  }
  function sync() { mode3d.setAttribute("aria-pressed", String(camera.pitch > D(-80))); }
  function topView(instant) {
    stopCamera();
    var o = { destination: TOP, orientation: { heading: 0, pitch: -Math.PI / 2, roll: 0 } };
    if (instant || reduce) { camera.setView(o); sync(); scene.requestRender(); }
    else camera.flyTo(Object.assign(o, { duration: 1.2, complete: sync }));
  }
  function view3d(instant) { var s = pose(); place(s.t, s.h, PITCH_3D, s.r * 0.75, instant); }

  mode3d.addEventListener("click", function () { if (mode3d.getAttribute("aria-pressed") === "true") topView(); else view3d(); });
  document.getElementById("reset").addEventListener("click", function () { topView(); });
  var STEP = { left: [D(-20), 0, 1], right: [D(20), 0, 1], up: [0, D(10), 1], down: [0, D(-10), 1], in: [0, 0, 0.65], out: [0, 0, 1.5] };
  document.querySelectorAll("[data-cam]").forEach(function (b) {
    b.addEventListener("click", function () {
      var s = pose(), d = STEP[b.dataset.cam];
      // Rotating from straight down first tilts into 3D, or the turn would only spin the map.
      var p = s.p + d[1];
      if (d[0] && s.p < D(-80)) p = PITCH_3D;
      place(s.t, s.h + d[0], p, s.r * d[2]);
    });
  });
  camera.moveEnd.addEventListener(sync);

  var legend = document.getElementById("legend");
  var LAYER = {
    imagery: function (on) { viewer.imageryLayers.get(0).show = on; },
    wind: function (on) { wind.show = on; legend.hidden = !on; },
    terrain: function (on) { scene.verticalExaggeration = on ? 1 : 0; }
  };
  document.querySelectorAll("[data-layer]").forEach(function (b) {
    b.addEventListener("click", function () {
      var on = b.getAttribute("aria-pressed") !== "true";
      b.setAttribute("aria-pressed", String(on)); LAYER[b.dataset.layer](on); scene.requestRender();
    });
  });

  // Phones: a simple, slowly orbiting 3D view with one pause control (held still under reduced motion).
  var orbitBtn = document.getElementById("orbit"), orbiting = false, orbitWanted = false, orbitH = D(-20), orbitId = 0;
  var PAUSE = "Pause", PLAY = "Play";
  function orbitFrame() {
    camera.lookAt(HOME, new C.HeadingPitchRange(orbitH, D(-30), 90000));
    scene.requestRender();
  }
  function orbit(on) {
    orbitWanted = on && !reduce && !failed;
    on = orbitWanted && shown;
    orbiting = on; orbitBtn.textContent = on ? PAUSE : PLAY;
    var id = ++orbitId, last = performance.now();
    if (on) requestAnimationFrame(function tick(now) {
      if (!orbiting || id !== orbitId) return;
      orbitH += (now - last) * 0.00012; last = now; orbitFrame();
      requestAnimationFrame(tick);
    });
  }
  orbitBtn.addEventListener("click", function () { orbit(!orbiting); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) orbit(false); });

  reduce = motion.matches; // The preference may have changed while terrain was loading.
  var qs = new URLSearchParams(location.search);
  if (qs.has("bare")) document.body.classList.add("bare");
  var phone = qs.has("phone") || matchMedia("(max-width: 30em)").matches;
  if (phone) {
    document.body.classList.add("phone");
    scene.screenSpaceCameraController.enableInputs = false;
    orbitFrame();
    orbitBtn.hidden = reduce; orbit(!reduce);
  } else if (qs.get("view") === "3d") { topView(true); view3d(true); }
  else topView(true);
  motion.addEventListener("change", function () {
    reduce = motion.matches;
    if (reduce) { stopCamera(); orbit(false); sync(); scene.requestRender(); }
    // Never restart motion automatically when the preference changes back.
    if (phone) orbitBtn.hidden = reduce || failed;
  });

  // An empty queue can follow failed requests. Provider/render errors remain authoritative.
  var loadingSeen = false;
  globe.tileLoadProgressEvent.addEventListener(function (n) {
    if (n > 0) loadingSeen = true;
    if (!failed && !shown && loadingSeen && n === 0 && globe.tilesLoaded) {
      shown = true; controls(false);
      document.body.classList.add("ready"); status.textContent = "";
      if (phone) orbit(orbitWanted);
    }
  });
})();
</script>
</body>
</html>
